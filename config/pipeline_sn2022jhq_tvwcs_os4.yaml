# SN2022jhq sectors 51 and 52: distortion-aware temporal-WCS OS4 field
# templates.  This is deliberately not an FFI-WCS build: mapping consumes the
# already-published per-SCC temporal Chebyshev/B-spline model.
#
# Prerequisite: both SCCs must have
# wcs/temporal_cheb5_bspline_v1/{frames.parquet,manifest.json}, as produced by
# the completed linear diff/centroid lane.  Verified present 2026-08-25.
#
# Submit templates through Hotpants as one scheduler-connected run:
#   syndiff submit --config config/pipeline_sn2022jhq_tvwcs_os4.yaml \
#     --scc config/scc_sn2022jhq_s51_s52.csv \
#     --run-id sn2022jhq_s51_s52_tvwcs_os4_hp_d_20260825
config_schema_version: 2
deployment_file: deployment.yaml

notifications:
  enabled: true
  bot:
    enabled: true

stages:
  # Keep field geometry explicit on both consumers.  The mapping source below
  # is the temporal model, not the SPOC/FFI WCS headers.
  wcs_grouping:
    geometry_mode: field
  mapping:
    oversampling_factor: 4
    store_name: tvwcs
    wcs_source: temporal_wcs
    temporal_wcs_version: temporal_cheb5_bspline_v1
    skip_download_catalog: false
    n_threads: 64
    condor_request_cpus: 64
    condor_request_memory: 80000
    host_stats_min_mem_mb: 80000
    host_stats_max_load15: 20.0
  ps1_process:
    # Recipe-matched shared cells are safe to reuse across these adjacent-CVZ
    # sectors; the requested template submit omits this stage.
    ps1_source: stream
    use_shared_convolved_store: true
    write_per_scc_convolved_zarr: false
    remove_saturated_stars: true
    enable_saturation_correction: false
  remap:
    store_name: tvwcs
    drift_source: per_skycell_temporal_wcs
    rebuild_remap_cache: true
    rebuild_inter_skycell_cache: true
    n_jobs: 64
    # OS4 regmaps do not fit reliably in the available execute-host scratch
    # allocations.  Read them from shared NFS rather than requesting 16 GB of
    # local disk and risking an ENOSPC/fallback cycle.
    stage_regmaps_to_scratch: false
    condor_request_cpus: 64
    condor_request_memory: 250000
    host_stats_min_mem_mb: 250000
    host_stats_max_load15: 20.0
  downsample:
    geometry_mode: field
    oversampling_factor: 4
    remap_store_name: tvwcs
    output_store_name: tvwcs
    rebuild_field_store: true
    materialize_fits: false
    n_jobs: 64
    executor: condor
    condor_request_cpus: 64
    condor_request_memory: 250000
    host_stats_min_mem_mb: 250000
    host_stats_max_load15: 20.0
    stage_regmaps_to_scratch: false

resources:
  # The two SCCs overlap substantially on the sky; serialize expensive shared
  # work and keep the OS4 memory profile to one active SCC at a time.
  mapping:
    max_concurrent: 2
  ps1_process:
    max_concurrent: 1
  remap:
    max_concurrent: 2
  downsample:
    max_concurrent: 2

# Diff sub-pipeline policy (folded in verbatim here per schema v2, formerly
# config/diff_config_sn2022jhq_tvwcs_os4_hp_d.yaml). SN2022jhq sectors 51 and
# 52: temporal-WCS, OS4 Hotpants-only diff.
#
# Templates are read from templates_tvwcs/oversampling_4, which is built by
# pipeline_sn2022jhq_tvwcs_os4.yaml using temporal_cheb5_bspline_v1.  No
# FFI-WCS template products are consumed.
#
# This intentionally runs only Hotpants and writes hp_d (plus its normal hp_c,
# hp_b, hp_m, and kernel metadata companions).  It reuses the robust background
# already estimated by the completed linear lane instead of re-running
# kernel_fit, convolved_templates, or background_estimate.
#
# SCC-only lane note: external_workspaces validates the dependency label but
# does not cross-link lanes.  Before submitting, create lane-local *symlinks*
# for each SCC (never copies) so the active diff_tvwcs lane can see the linear
# background and Hotpants mask inputs:
#   diff_tvwcs/ks_b -> ../diff_linear/ks_b
#   diff_tvwcs/shared_mask.fits.fz -> ../diff_linear/shared_mask.fits.fz
#   diff_tvwcs/hotpants_substamp_stars.csv -> ../diff_linear/hotpants_substamp_stars.csv
# Confirm the crop/manifest shape matches before creating those links.
diff:
  defaults:
    n_jobs: 64
    workspace_run_id: sn2022jhq_tvwcs_os4_hp_d_v1
    pipeline_plots: true
    oversampling_factor: 4

  paths:
    template_store_name: tvwcs
    remap_store_name: tvwcs
    output_store_name: tvwcs

  pipeline:
    - external_workspaces: [ks_b]
    - kind: hotpants
      inputs:
        bkg: ks_b
      # Measured on a 64-core/500-GB production node for the OS4 temporal-WCS
      # lane: 8 frame workers x 8 Hotpants threads was the best controlled
      # 64-thread setting.  Bound the group cache because drift changes groups
      # frequently and an unbounded OS4 cache is memory-expensive.
      hotpants_n_jobs: 8
      hotpants_os_n_jobs: 8
      template_cache_max_groups: 1
      hp_sigma_gauss: [0.752, 1.88, 3.76]
      hp_ko: 2
      hp_bgo: 0
      hp_nstampx: 10
      hp_nstampy: 10
      hp_nss: 100
      hp_ngauss: 3
      hp_deg_fixe: [6, 4, 2]
      hp_kf_spread_mask1: 0.0
      hp_ks: 3.0
      hp_kfm: 0.75
      hp_fitthresh: 5.0
      hp_stat_sig: 3.0
      hp_force_convolve: "t"
      hp_normalize: "t"
      write_convolved: false
      write_bkg: true
      write_stamps: false
      write_kernel_solutions: true
      output:
        diffs: hp_d
        convolved: hp_c
        bkg: hp_b

  condor:
    # Keep the split-stage profiles explicit even though this Hotpants-only
    # policy executes only the final ``diff`` slice.  The smaller class is now
    # 80 GB; the large background class is 400 GB for future reuse.
    diff_prep:
      request_cpus: 64
      request_memory: 80000
      host_stats_min_mem_mb: 80000
      host_stats_max_load15: 20.0
    background_estimate:
      request_cpus: 64
      request_memory: 400000
      host_stats_min_mem_mb: 400000
      host_stats_max_load15: 20.0
    diff:
      request_cpus: 64
      request_memory: 80000
      host_stats_min_mem_mb: 80000
      host_stats_max_load15: 20.0
