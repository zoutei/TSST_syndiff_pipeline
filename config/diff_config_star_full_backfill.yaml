# Full-frame Hotpants backfill for syndiff star (write_convolved + per-frame kernels).
deployment_file: deployment.yaml

defaults:
  n_jobs: 16
  pipeline_plots: false
  master_fits_mirror: true
  crop_mode: target_box
  crop_box_size: 1024
  workspace_run_id: star_full_lc

pipeline:
  - workspace_inherit:
      from: multi_hp_temp_calib
      labels:
        - ks_b_s
      root_artifacts:
        - shared_mask.fits.gz
        - hotpants_substamp_stars.csv
        - gaia_catalog_pipeline.csv
  - kind: hotpants
    inputs:
      bkg: ks_b_s
    hp_sigma_gauss: [0.752, 1.88, 3.76]
    hp_ko: 2
    hp_bgo: 0
    hp_nstampx: 10
    hp_nstampy: 10
    hp_nss: 100
    hp_ngauss: 3
    hp_deg_fixe: [6, 4, 2]
    hp_kf_spread_mask1: 0.0
    hp_ks: 3.0
    hp_kfm: 0.75
    hp_fitthresh: 5.0
    hp_stat_sig: 3.0
    hp_force_convolve: "t"
    hp_normalize: "t"
    write_convolved: true
    write_bkg: true
    write_stamps: false
    output:
      diffs: hp_d
      convolved: hp_c
      bkg: hp_b
    write_kernel_solutions: true

overrides:
  "20/3/2":
    target_name: s20_astrometry
