# CVZ SCCs: publish per-SCC temporal Chebyshev WCS from already-completed
# linear centroid/diff products (mirrors diff_config_s20_c3_k3_temporal_wcs.yaml).
# Performs no subtraction, ePSF, or centroid extraction -- consumes the
# FULL (not smoke-limited) linear-lane hp_d/centroids_r1 already on disk.
# Prerequisite: the full CVZ linear diff run (kernel_fit->hp_d->epsf->
# centroids) must have completed for the target SCC(s) first.
#
# Use (one SCC at a time or via --scc):
#   syndiff diff submit --config config/diff_config_cvz_temporal_wcs.yaml \
#     --scc config/scc_cvz_s50_only.csv --stages diff \
#     --run-id cvz_s50_temporal_wcs_<date> --skip-artifact-verify
deployment_file: deployment.yaml

defaults:
  n_jobs: 32

paths:
  output_store_name: linear

pipeline:
  - external_workspaces: [centroids_r1, hp_d]
  - kind: temporal_wcs
    inputs:
      centroids: centroids_r1
      diffs: hp_d
    output: temporal_wcs
    version: temporal_cheb5_bspline_v1
    spatial_basis: chebyshev
    cheb_degree: 5
    temporal_basis: bspline
    spline_degree: 3
    n_interior_knots: 20
    edge_densify_knots: true
    edge_fraction: 0.12
    clip_n_sigma: 3.0
    clip_max_iter: 3
    min_stars: 50
    debug_plots: true
    # Per-frame Chebyshev fit loop is now process-parallel (2026-08-23).
    # Empirically swept 1/8/16/32/64 workers on a clean, dedicated 64-core
    # node against real CVZ frames: 32 is the actual sweet spot (1.52x vs
    # serial); 64 is WORSE than 32 (scheduling/IPC overhead exceeds the
    # gain past this point on the current ecsv-bound per-frame cost) --
    # do not bump this to 64 without re-measuring.
    n_jobs: 32
    # Private Parquet read-through cache for the slow per-frame ecsv read
    # (astropy's ascii.ecsv reader is pure-Python and dominates per-frame
    # cost; a cached copy reads back ~10x faster). Verified bit-identical
    # fit output cold/warm/disabled. Biggest win on a retried run -- a
    # clean first run still pays the ecsv read once per frame regardless.
    enable_read_cache: true
