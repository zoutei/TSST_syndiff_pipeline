# Site diff policy. Paths resolve from deployment.yaml + per-target layout.
# Targets are passed on the CLI via --targets (never embedded here).
#
# Ownership:
#   defaults: / top-level — multi-stage knobs (crop, n_jobs, plots, workspace_run_id)
#   pipeline kind: — stage-only knobs (omit keys that match dataclass defaults)
#   mask_settings.yaml (sibling; optional) — mask geometry/policy (NOT embedded here)
# Frozen ws/diff_config.yaml is a slim snapshot (empties/defaults/bundled paths omitted).
deployment_file: deployment.yaml

defaults:
  n_jobs: 16
  pipeline_plots: false
  master_fits_mirror: true
  crop_mode: target_box
  crop_box_size: 1024

# Global forced-photometry extras — applied to every target.
# dx/dy are crop-local pixel offsets from the primary target's per-frame WCS position.
additional_forced_targets:
  - name: offset_top
    dx: 0
    dy: -7
  - name: offset_bottom
    dx: 0
    dy: 7
  - name: offset_right
    dx: 7
    dy: 0
  - name: offset_left
    dx: -7
    dy: 0

pipeline:
  - kind: astrometry
  - kind: shared_mask
  - kind: hotpants
    science: ffi
    # Only non-default / wiring keys; other hp_* use HotpantsParams defaults.
    hp_sigma_gauss: [0.752, 1.88, 3.76]
    hp_kf_spread_mask1: 0.0
    write_kernel_solutions: true
    write_convolved: false
    write_bkg: true
    write_stamps: false
    output:
      diffs: hp_d
      convolved: hp_c
      bkg: hp_b
  - kind: forced_photometry
    inputs:
      diffs: hp_d
    output: lc_prf_on_diffs
    methods:
      - name: prf
        type: psf
        psf_type: prf
      - name: ap3
        type: aperture
        tar_ap: 3
        sky_in: 5
        sky_out: 9

condor:
  request_cpus: 16
  request_memory: 100000
  requirements: "Memory >= 100000 && LoadAvg < 10"
  rank: "-LoadAvg"
