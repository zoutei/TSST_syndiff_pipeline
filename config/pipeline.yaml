# Orchestrator policy: template stages, resource pools, notifications.
# Machine-specific paths live in deployment.yaml (copy deployment.yaml.example).
# Targets are passed on the CLI via --targets (never embedded here).
deployment_file: deployment.yaml
diff_config: diff_config_single_kernel.yaml
star_config: star_config.yaml

stages:
  wcs_grouping:
    offset_threshold: 0.01
    wcs_drift_savgol_window: 11
    wcs_drift_savgol_polyorder: 2
    # Full-chip templates; use diff_config crop override for smaller differencing ROI.
    crop_mode: full
    geometry_mode: field
  mapping:
    oversampling_factor: 1
    buffer: 200
    tess_buffer: 150
    skip_download_catalog: false
  ps1_download:
    num_workers: 8
    overwrite: false
  ps1_process:
    ps1_source: zarr
    remove_saturated_stars: true
    enable_saturation_correction: false
    psf_sigma: 40.0
    projections_limit: null
    # use_shared_convolved_store: false   # PR5 shared store; operator gate required before enabling
    # write_per_scc_convolved_zarr: true  # must be false when use_shared_convolved_store is true
  downsample:
    geometry_mode: field
    ignore_mask_bits: [12]
    oversampling_factor: 1
    # executor: local          # default; set condor + resource keys for heavy oversampled runs
    # condor_request_cpus: 16
    # condor_request_memory: 128000
  diff:
    executor: condor
  star:
    executor: condor

resources:
  network:
    max_concurrent: 1
  downsample:
    max_concurrent: 2
  mapping:
    max_concurrent: 6
  ps1_process:
    max_concurrent: 4
  diff:
    max_concurrent: 6
  star:
    max_concurrent: 4

scheduler:
  heartbeat_interval_s: 30.0
  # condor_hold_timeout_s: 600.0  # remove held Condor jobs after N seconds (default 600)

notifications:
  enabled: true
  events:
    run_started: true
    run_completed: true
    run_failed: true
    run_canceled: true
    run_retried: true
    run_stalled: true
    run_resumed: true
    stage_failed: true
    stage_completed: true
    stage_canceled: true
    stage_died: true
    daemon_unhealthy: true
  bot:
    enabled: true

overrides:
  "23/2/1":
    stages:
      ps1_process:
        projections_limit: 1
