# Orchestrator policy: template stages, resource pools, notifications, plus
# the embedded diff: policy (schema v2 -- see CLAUDE.md's site-config table).
# Machine-specific paths live in deployment.yaml (copy deployment.yaml.example).
# Targets are passed on the CLI via --targets (never embedded here).
config_schema_version: 2
deployment_file: deployment.yaml
star_config: star_config.yaml
# photometry_config: photometry_config.yaml  # optional; namespaces phot_{run_id}/ + host_star/

stages:
  wcs_grouping:
    offset_threshold: 0.01
    wcs_drift_savgol_window: 11
    wcs_drift_savgol_polyorder: 2
    # Full-chip templates; use diff_config crop override for smaller differencing ROI.
    crop_mode: full
    geometry_mode: field
  mapping:
    oversampling_factor: 1
    buffer: 200
    tess_buffer: 150
    skip_download_catalog: false
  ps1_download:
    num_workers: 8
    overwrite: false
  ps1_process:
    ps1_source: zarr
    remove_saturated_stars: true
    enable_saturation_correction: false
    psf_sigma: 40.0
    projections_limit: null
    # use_shared_convolved_store: false   # PR5 shared store; operator gate required before enabling
    # write_per_scc_convolved_zarr: true  # must be false when use_shared_convolved_store is true
  downsample:
    geometry_mode: field
    ignore_mask_bits: [12]
    oversampling_factor: 1
    # executor: local          # default; set condor + resource keys for heavy oversampled runs
    # condor_request_cpus: 16
    # condor_request_memory: 128000
  diff:
    executor: condor
  star:
    executor: condor

resources:
  network:
    max_concurrent: 1
  downsample:
    max_concurrent: 2
  mapping:
    max_concurrent: 6
  ps1_process:
    max_concurrent: 4
  diff:
    max_concurrent: 6
  star:
    max_concurrent: 4

scheduler:
  heartbeat_interval_s: 30.0
  # condor_hold_timeout_s: 600.0  # remove held Condor jobs after N seconds (default 600)

notifications:
  enabled: true
  events:
    run_started: true
    run_completed: true
    run_failed: true
    run_canceled: true
    run_retried: true
    run_stalled: true
    run_resumed: true
    stage_failed: true
    stage_completed: true
    stage_canceled: true
    stage_died: true
    daemon_unhealthy: true
  bot:
    enabled: true

overrides:
  "23/2/1":
    stages:
      ps1_process:
        projections_limit: 1

# Diff sub-pipeline policy (formerly diff_config_single_kernel.yaml, folded
# in verbatim here per schema v2). Single-kernel diff policy: Gaia shared
# mask -> min-background HP2 kernel -> convolved templates -> per-FFI
# algebraic diff + photutils (no Hotpants).
diff:
  deployment_file: deployment.yaml

  defaults:
    n_jobs: 16
    pipeline_plots: false
    workspace_run_id: single_hp_kernel   # debug → events/{target}/ws_dbg_test/
    # workspace_run_id: null

  paths:
    output_store_name: l4_split_smoke
    template_store_name: null
    remap_store_name: null

  pipeline:
    - kind: shared_mask
    - kind: kernel_fit
      weighting_factor: 0.5
      write_debug_fits: true
      output: kernel_fit
      hp_sigma_gauss: [0.752, 1.88, 3.76]
      hp_ko: 2
      hp_bgo: 3
      hp_nstampx: 10
      hp_nstampy: 10
      hp_nss: 100
      hp_ngauss: 3
      hp_deg_fixe: [6, 4, 2]
      hp_kf_spread_mask1: 0.0
      hp_ks: 3.0
      hp_kfm: 0.75
      hp_fitthresh: 5.0
      hp_stat_sig: 3.0
      hp_force_convolve: "t"
      hp_normalize: "t"
      write_kernel_params: true
    - kind: convolved_templates
      inputs:
        kernel_fit: kernel_fit
      output: tmpl_conv
    - kind: background_estimate
      inputs:
        convolved: tmpl_conv
      output:
        diffs: ks_d
        phot_bkg: ks_b
    - kind: background_temporal_smoothing
      inputs:
        bkg_in: ks_b
      output: ks_b_s
      recombine_inputs: false
      steps:
        spatial:
          enabled: false
        temporal:
          enabled: true
          method: savgol
          tile_size: 256
        strap:
          enabled: false
    - kind: subtract
      inputs:
        expression: "ks_d + ks_b - ks_b_s"
      output: ks_d_s

  condor:
    request_cpus: 16
    request_memory: 100000
    host_stats_min_mem_mb: 100000
    host_stats_max_load15: 10.0
