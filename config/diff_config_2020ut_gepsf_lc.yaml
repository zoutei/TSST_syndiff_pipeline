# gepsf-only forced photometry on all hp_d frames (PRF/aperture live elsewhere).
# Inherits per-frame gridded ePSF from ws_multi_hp_temp_calib_epsf as it is built.
deployment_file: deployment.yaml

defaults:
  n_jobs: 16
  workspace_run_id: multi_hp_temp_calib_gepsf_lc
  pipeline_plots: true
  crop_mode: target_box
  crop_box_size: 1024

additional_forced_targets:
  - name: offset_top
    dx: 0
    dy: -7
  - name: offset_bottom
    dx: 0
    dy: 7
  - name: offset_right
    dx: 7
    dy: 0
  - name: offset_left
    dx: -7
    dy: 0

pipeline:
  - workspace_inherit:
      from: multi_hp_temp_calib
      labels: [hp_d]
      root_artifacts:
        - shared_mask.fits
        - gaia_catalog_pipeline.csv
        - hotpants_substamp_stars.csv
        - targets.reg
  - workspace_inherit:
      from: multi_hp_temp_calib_epsf
      labels: [epsf_r1]
  - kind: forced_photometry
    inputs:
      diffs: hp_d
      epsf: epsf_r1
    output: lc_gepsf
    methods:
      - name: gepsf
        type: psf
        psf_type: epsf
        fit_shape: 11
        aperture_radius: 2

condor:
  request_cpus: 16
  request_memory: 64000
  requirements: "Memory >= 64000 && LoadAvg < 10"
  rank: "-LoadAvg"
