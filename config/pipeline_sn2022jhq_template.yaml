# SN2022jhq template build (s50,51,52,54,55): true geometry_mode=linear bootstrap
# templates, same recipe as the s50-55 CVZ pilot (pipeline_cvz_bk_shared_os1.yaml)
# but on SN2022jhq's own chips -- its TNS position (RA 271.261542, Dec 56.266911)
# does NOT land on the pilot's built chips (cam4/ccd4, cam3/ccd4, cam3/ccd3,
# cam4/ccd3); tess_stars2px puts it on cam4/ccd2 (s50,s51), cam2/ccd1 (s52),
# cam4/ccd1 (s54,s55). Not observed in s53 (chip gap) -- omitted from the SCC csv.
#
# Usage:
#   mamba activate syndiff
#   syndiff template submit \
#     --config config/pipeline_sn2022jhq_template.yaml \
#     --scc config/scc_sn2022jhq.csv \
#     --run-id sn2022jhq_template_<date>
config_schema_version: 2
deployment_file: deployment.yaml

stages:
  wcs_grouping:
    geometry_mode: field
    offset_threshold: 0.01
    wcs_drift_savgol_window: 11
    wcs_drift_savgol_polyorder: 2
  mapping:
    oversampling_factor: 1
    template_conv_pad_spare_px: 4
    buffer: 200
    tess_buffer: 150
    skip_download_catalog: false
  ps1_process:
    ps1_source: stream
    use_shared_convolved_store: true
    write_per_scc_convolved_zarr: false
    psf_sigma: 40.0
    remove_saturated_stars: true
    enable_saturation_correction: false
    executor: condor
    condor_request_cpus: 64
    condor_request_memory: 500000
  remap:
    drift_source: point
    apply_intra_skycell: false
    apply_inter_skycell: false
    store_name: linear
    intra_skycell_R: 1
    rebuild_remap_cache: true
    rebuild_inter_skycell_cache: false
    raw_drift_outlier_sigma: 5.0
    n_jobs: 32
    executor: condor
    condor_request_cpus: 32
    condor_request_memory: 128000
  downsample:
    geometry_mode: linear
    remap_store_name: linear
    output_store_name: linear
    rebuild_field_store: true
    oversampling_factor: 1
    ignore_mask_bits: [12]
    n_jobs: 16
    executor: condor
    condor_request_cpus: 32
    # 100000, not 128000: linear downsample doesn't need field-mode's memory
    # headroom, and 128000 combined with host_stats_min_mem_mb=128000 made
    # the 128GB-class nodes structurally unmatchable (a node can never have
    # 128000MB *available* out of a 128380MB total). host_stats_min_mem_mb
    # dropped to match so those nodes become real candidates again.
    condor_request_memory: 100000
    host_stats_min_mem_mb: 100000
    # No condor_request_disk at all (omitted -> None -> no RequestDisk clause
    # in the Condor Requirements): a 4GB ask previously left 0 machines able
    # to satisfy the partitionable-disk share on the 2 memory-eligible nodes
    # during cluster contention (condor_q -better-analyze showed Disk as the
    # sole failing clause after Memory/Machine filtering), and downsample
    # doesn't need a storage floor at all (2026-08-23).
  diff:
    executor: condor

resources:
  network:
    max_concurrent: 1
  mapping:
    max_concurrent: 5
  # These 5 SCCs are new chips (no shared-store overlap with the s50-55 pilot's
  # cam3/cam4 chips built so far), but ps1_process still writes into the same
  # shared combined/convolved Zarr store -- keep it serialized per the pilot's
  # own convention rather than risk concurrent-writer cache races.
  ps1_process:
    max_concurrent: 1
  remap:
    max_concurrent: 2
  downsample:
    max_concurrent: 2
  diff_prep:
    max_concurrent: 4
  background_estimate:
    max_concurrent: 2
  diff:
    max_concurrent: 4

scheduler:
  heartbeat_interval_s: 30.0

notifications:
  enabled: true
  events:
    run_started: true
    run_completed: true
    run_failed: true
    stage_failed: true
    stage_completed: true
  bot:
    enabled: true

# Diff sub-pipeline policy (folded in verbatim here per schema v2, formerly
# config/diff_config_sn2022jhq.yaml). SN2022jhq diff: shared_mask -> kernel_fit
# -> convolved_templates -> background_estimate -> hotpants (hp_d) -> epsf
# (orbit_binned). centroids/temporal_wcs are commented out below (2026-08-25,
# shared-mask boundary-bug redo) -- re-enable both together if needed;
# temporal_wcs consumes centroids_r1 directly.
# Own copy of diff_config_cvz_linear_os1_epsf_centroids.yaml (same recipe,
# same knobs) rather than editing that shared pilot file directly -- SN2022jhq
# runs on its own chips (cam4/ccd2, cam2/ccd1, cam4/ccd1; see
# config/scc_sn2022jhq.csv), so there's no data overlap, but the shared file
# is actively being edited by other concurrent campaigns.
# temporal_wcs params (when re-enabled) mirror
# config/diff_config_cvz_temporal_wcs.yaml, folded into this same
# pipeline/run (reads centroids_r1/hp_d produced just above, no
# external_workspaces needed since it's the same workspace).
diff:
  defaults:
    n_jobs: 32
    workspace_run_id: sn2022jhq_v1
    pipeline_plots: true
    oversampling_factor: 1

  paths:
    template_store_name: linear
    remap_store_name: linear
    output_store_name: linear

  pipeline:
    - kind: shared_mask
    - kind: kernel_fit
      weighting_factor: 0.5
      write_debug_fits: true
      output: kernel_fit
      hp_sigma_gauss: [0.752, 1.88, 3.76]
      hp_ko: 2
      hp_bgo: 3
      hp_nstampx: 10
      hp_nstampy: 10
      hp_nss: 100
      hp_ngauss: 3
      hp_deg_fixe: [6, 4, 2]
      hp_kf_spread_mask1: 0.0
      hp_ks: 3.0
      hp_kfm: 0.75
      hp_fitthresh: 5.0
      hp_stat_sig: 3.0
      hp_force_convolve: "t"
      hp_normalize: "t"
      write_kernel_params: true
    - kind: convolved_templates
      inputs:
        kernel_fit: kernel_fit
      output: tmpl_conv
    - kind: background_estimate
      inputs:
        convolved: tmpl_conv
      # 48, not 32/64: s52 OOM'd at n_jobs=32 / 331 GB against a 128 GB cgroup
      # (~10.3 GB/worker). This stage now runs as its own 500 GB Condor job, so
      # 48 workers is ~494 GB on that chip's profile -- tight but the point of
      # the split. If s52 OOMs, drop this knob to 32 and retry (skip_existing
      # keeps finished frames). s50/s51 already finished this kind.
      background_estimate_n_jobs: 48
      output:
        diffs: ks_d
        phot_bkg: ks_b
    - kind: hotpants
      inputs:
        bkg: ks_b
      hotpants_n_jobs: 64
      hp_sigma_gauss: [0.752, 1.88, 3.76]
      hp_ko: 2
      hp_bgo: 0
      hp_nstampx: 10
      hp_nstampy: 10
      hp_nss: 100
      hp_ngauss: 3
      hp_deg_fixe: [6, 4, 2]
      hp_kf_spread_mask1: 0.0
      hp_ks: 3.0
      hp_kfm: 0.75
      hp_fitthresh: 5.0
      hp_stat_sig: 3.0
      hp_force_convolve: "t"
      hp_normalize: "t"
      write_convolved: false
      write_bkg: true
      write_stamps: false
      write_kernel_solutions: true
      output:
        diffs: hp_d
        convolved: hp_c
        bkg: hp_b
    - kind: epsf
      inputs:
        diffs: hp_d
      output: epsf_r1
      epsf_mode: orbit_binned
      tile_nx: 4
      tile_ny: 4
      tess_mag_min: 8.0
      tess_mag_max: 13.0
      epsf_isolation_min_sep_px: 6.0
      epsf_isolation_neighbor_mag_max: 13.0
      epsf_n_jobs: 64
    # centroids/temporal_wcs disabled for the shared-mask-boundary-bug redo
    # (2026-08-25): temporal_wcs consumes centroids_r1 directly, so both are
    # commented out together rather than leaving a dangling input reference.
    # - kind: centroids
    #   inputs:
    #     diffs: hp_d
    #     epsf: epsf_r1
    #   output: centroids_r1
    #   # Bumped 32->64 (2026-08-25): the prior 32 cap was inherited from an
    #   # epsf_n_jobs=64/centroids_n_jobs=64 OOM at 120GB (measured ~101GB) seen
    #   # on diff_config_cvz_linear_os1_epsf_centroids.yaml's much denser CVZ
    #   # field. Live-measured on this field's own centroids run (s0055,
    #   # n_jobs=32): only ~20GB RSS against the 120GB cgroup limit, so 64
    #   # workers (~35-40GB projected) still has large headroom here. Watch the
    #   # first retry under this setting; revert to 32 (or bump request_memory
    #   # like the CVZ config did) if it OOMs on a different SCC's field.
    #   centroids_n_jobs: 64
    # - kind: temporal_wcs
    #   inputs:
    #     centroids: centroids_r1
    #     diffs: hp_d
    #   output: temporal_wcs
    #   version: temporal_cheb5_bspline_v1
    #   spatial_basis: chebyshev
    #   cheb_degree: 5
    #   temporal_basis: bspline
    #   spline_degree: 3
    #   n_interior_knots: 20
    #   edge_densify_knots: true
    #   edge_fraction: 0.12
    #   clip_n_sigma: 3.0
    #   clip_max_iter: 3
    #   min_stars: 50
    #   debug_plots: true

  condor:
    diff_prep:
      # Measured usage across full completed runs: <1 CPU-core-equivalent
      # (Total Remote Usage ~2-3 min over a several-minute wall run), ~150-170
      # MB peak memory. 4 cpus / 16 GB leaves generous headroom while letting
      # this stage match on almost any node instead of needing 32 free CPUs.
      request_cpus: 4
      request_memory: 16000
      host_stats_min_mem_mb: 16000
      # diff_prep's own footprint (<1 core, ~170 MB) won't meaningfully add to
      # a node's load, so gating it on the node's existing load15 just excludes
      # otherwise-idle-capacity nodes for no reason. Effectively unbounded.
      host_stats_max_load15: 200.0
    background_estimate:
      request_cpus: 64
      request_memory: 300000
      host_stats_min_mem_mb: 300000
      host_stats_max_load15: 20.0
    diff:
      request_cpus: 64
      # Measured peak (hotpants hp_d, n_jobs=64): 54-73 GB historically. 80 GB
      # still keeps real margin above that while opening up more nodes whose
      # free memory sits in the 80-100 GB range.
      request_memory: 80000
      host_stats_min_mem_mb: 80000
      host_stats_max_load15: 20.0
