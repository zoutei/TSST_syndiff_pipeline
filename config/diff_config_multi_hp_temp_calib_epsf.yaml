# Inherit hp_d from ws_multi_hp_temp_calib; build gridded ePSF + gepsf photometry.
# SCC-only: workspace_inherit removed; hp_d/hp_m must exist on the SCC diff lane.
deployment_file: deployment.yaml

defaults:
  n_jobs: 16
  workspace_run_id: multi_hp_temp_calib_epsf
  pipeline_plots: true
  crop_mode: target_box
  crop_box_size: 1024
  max_ffis: 24

pipeline:
  - external_workspaces:
      - hp_d
      - hp_m
  - kind: epsf
    inputs:
      diffs: hp_d
    output: epsf_r1
    tile_nx: 2
    tile_ny: 2
    epsf_oversample: 2
    psf_size: 11
    min_stars_per_tile: 5
    mag_max_rp: 12.95
    epsf_n_jobs: 8

condor:
  request_cpus: 16
  request_memory: 100000
  requirements: "Memory >= 100000 && LoadAvg < 10"
  rank: "-LoadAvg"
