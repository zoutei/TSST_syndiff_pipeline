# Site policy for syndiff star (host-star light curves).
# Consumes transient diff workspace artifacts; does not re-run Hotpants.
deployment_file: deployment.yaml

defaults:
  cutout_size: 96
  stamp_size: 35
  perband: true
  stamp_source: difference
  # template_recipe: <producing lane operator YAML>  # defaults to the template store sidecar
  oversampling_factor: 1   # SCC templates/mapping oversampling_{N}/
  ps1_source: zarr_download   # zarr_local_only | zarr_download | stream
  debug_plots: true
  max_ffis: null
  overwrite: false

baseline:
  workspace_run_id: none
  diffs: hp_d
  convolved: hp_c
  phot_bkg: ks_b_s

photometry:
  methods:
    - {name: r4, type: aperture, radius: 4, annulus: [12, 16]}
    - {name: r6, type: aperture, radius: 6, annulus: [12, 16]}
    - {name: r8, type: aperture, radius: 8, annulus: [12, 16]}

condor:
  request_cpus: 8
  request_memory: 100000
  requirements: 'Memory >= 100000 && LoadAvg < 10 && Machine != "plscience10.stsci.edu"'
  rank: "-LoadAvg"

overrides:
  "20/3/2":
    ps1_source: zarr_local_only
    overwrite: true
    baseline:
      workspace_run_id: star_full_lc
      phot_bkg: ks_b_s
