# Star LC verification: gridded ePSF on baseline hp_d, then gepsf on star diff stamps.
# Pairs with star_targets_example.csv / s0020_c3_k2_s20_astrometry (baseline ws_star_full_lc).
deployment_file: deployment.yaml

defaults:
  cutout_size: 96
  stamp_size: 24
  kernel_margin_px: 470
  ps1_source: zarr_local_only
  debug_plots: true
  workspace_run_id: star_lc_epsf
  max_ffis: null
  overwrite: true

baseline:
  workspace_run_id: star_full_lc
  diffs: hp_d
  convolved: hp_c
  phot_bkg: ks_b_s

epsf:
  enabled: true
  inputs:
    diffs: hp_d
  output: epsf_r1
  tile_nx: 2
  tile_ny: 2
  epsf_oversample: 4
  psf_size: 11
  extract_size: 11
  min_stars_per_tile: 5
  mag_max_rp: 12.95
  epsf_maxiters: 15
  epsf_recentering_maxiters: 20
  epsf_n_jobs: 8

photometry:
  methods:
    - name: gepsf
      type: psf
      psf_type: epsf
      inputs:
        epsf: epsf_r1
      fit_shape: 11
      aperture_radius: 2
      psf_grouper_min_separation: 10

overrides:
  "20/3/2":
    ps1_source: zarr_local_only
    overwrite: true

condor:
  request_cpus: 8
  request_memory: 100000
  requirements: 'Memory >= 100000 && LoadAvg < 10 && Machine != "plscience10.stsci.edu"'
  rank: "-LoadAvg"

