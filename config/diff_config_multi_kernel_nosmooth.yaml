# Resume multi-kernel diff without temporal background smoothing.
# Inherits ks_b from ws_multi_hp_temp_calib; Hotpants R2 uses per-FFI photutils bkg directly.
# Use: point run source_diff_config_path here, then syndiff retry --stage diff
deployment_file: deployment.yaml

defaults:
  n_jobs: 16
  pipeline_plots: false
  master_fits_mirror: true
  crop_mode: target_box
  crop_box_size: 1024
  workspace_run_id: multi_hp_nosmooth

additional_forced_targets:
  - name: offset_top
    dx: 0
    dy: -7
  - name: offset_bottom
    dx: 0
    dy: 7
  - name: offset_right
    dx: 7
    dy: 0
  - name: offset_left
    dx: -7
    dy: 0

pipeline:
  - workspace_inherit:
      from: multi_hp_temp_calib
      labels: [ks_b]
      root_artifacts:
        - shared_mask.fits.gz
        - hotpants_substamp_stars.csv
  - kind: hotpants
    inputs:
      bkg: ks_b
    hp_sigma_gauss: [0.752, 1.88, 3.76]
    hp_ko: 2
    hp_bgo: 0
    hp_nstampx: 10
    hp_nstampy: 10
    hp_nss: 100
    hp_ngauss: 3
    hp_deg_fixe: [6, 4, 2]
    hp_kf_spread_mask1: 0.0
    hp_ks: 3.0
    hp_kfm: 0.75
    hp_fitthresh: 5.0
    hp_stat_sig: 3.0
    hp_force_convolve: "t"
    hp_normalize: "t"
    write_convolved: false
    write_bkg: true
    write_stamps: false
    output:
      diffs: hp_d
      convolved: hp_c
      bkg: hp_b
    write_kernel_solutions: true
  - kind: forced_photometry
    inputs:
      diffs: hp_d
    output: lc_prf_on_hp_diffs
    methods:
      - name: prf
        type: psf
        psf_type: prf
      - name: ap3
        type: aperture
        tar_ap: 3
        sky_in: 5
        sky_out: 9

condor:
  request_cpus: 16
  request_memory: 100000
  requirements: "Memory >= 100000 && LoadAvg < 10"
  rank: "-LoadAvg"
