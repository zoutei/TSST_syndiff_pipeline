# TEMPORARY smoke-test variant of diff_config_s20_c3_k3_tvwcs_os4_epsf_centroids.yaml
# (max_ffis: 10 added) -- validates kernel_fit/convolved_templates/
# background_estimate/hotpants/epsf(orbit_binned)/centroids end-to-end against
# the freshly-rebuilt (Gaia-catalog-fixed) templates_tvwcs before committing
# to a full-SCC run. Delete after use; not meant to be a lasting config.
deployment_file: deployment.yaml

defaults:
  n_jobs: 10
  max_ffis: 10
  workspace_run_id: s20_c3_k3_tvwcs_os4_epsf_centroids_smoke10
  pipeline_plots: true
  oversampling_factor: 4

paths:
  template_store_name: tvwcs
  output_store_name: tvwcs
  remap_store_name: tvwcs

pipeline:
  - kind: kernel_fit
    weighting_factor: 0.5
    write_debug_fits: true
    output: kernel_fit
    hp_sigma_gauss: [0.752, 1.88, 3.76]
    hp_ko: 2
    hp_bgo: 3
    hp_nstampx: 10
    hp_nstampy: 10
    hp_nss: 100
    hp_ngauss: 3
    hp_deg_fixe: [6, 4, 2]
    hp_kf_spread_mask1: 0.0
    hp_ks: 3.0
    hp_kfm: 0.75
    hp_fitthresh: 5.0
    hp_stat_sig: 3.0
    hp_force_convolve: "t"
    hp_normalize: "t"
    write_kernel_params: true
  - kind: convolved_templates
    inputs:
      kernel_fit: kernel_fit
    output: tmpl_conv
  - kind: background_estimate
    inputs:
      convolved: tmpl_conv
    output:
      diffs: ks_d
      phot_bkg: ks_b
  - kind: hotpants
    inputs:
      bkg: ks_b
    hotpants_n_jobs: 1
    template_cache_max_groups: 1
    hp_sigma_gauss: [0.752, 1.88, 3.76]
    hp_ko: 2
    hp_bgo: 0
    hp_nstampx: 10
    hp_nstampy: 10
    hp_nss: 100
    hp_ngauss: 3
    hp_deg_fixe: [6, 4, 2]
    hp_kf_spread_mask1: 0.0
    hp_ks: 3.0
    hp_kfm: 0.75
    hp_fitthresh: 5.0
    hp_stat_sig: 3.0
    hp_force_convolve: "t"
    hp_normalize: "t"
    write_convolved: false
    write_bkg: true
    write_stamps: false
    output:
      diffs: hp_d
      convolved: hp_c
      bkg: hp_b
    write_kernel_solutions: true
  - kind: epsf
    inputs:
      diffs: hp_d
    output: epsf_r1
    epsf_mode: orbit_binned
    tile_nx: 4
    tile_ny: 4
    epsf_oversample: 4
    psf_size: 15
    extract_size: 15
    min_stars_per_tile: 5
    tess_mag_min: 8.0
    tess_mag_max: 13.0
    epsf_isolation_min_sep_px: 6.0
    epsf_isolation_neighbor_mag_max: 13.0
    epsf_maxiters: 15
    epsf_recentering_maxiters: 20
    epsf_n_jobs: 10
  - kind: centroids
    inputs:
      diffs: hp_d
      epsf: epsf_r1
    output: centroids_r1
    tess_mag_max: 10.0
    fit_shape: 11
    aperture_radius: 2
    psf_grouper_min_separation: 4
    centroids_n_jobs: 10

condor:
  request_cpus: 10
  # 100GB (up from 80GB): validated against a real unbounded-template-cache
  # OOM (99658MB used before hold) on 2026-08-22; fixed via
  # HotpantsParams.template_cache_max_groups (bounded LRU, default 2), but
  # keeping headroom here until the fix is confirmed at full-SCC scale.
  request_memory: 100000
  host_stats_min_mem_mb: 100000
  host_stats_max_load15: 10.0
