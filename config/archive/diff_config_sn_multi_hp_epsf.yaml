# Unified SN batch: multi_hp_temp_calib hotpants diffs + gridded ePSF + gepsf light curves.
# Writes ws_multi_hp_temp_calib_epsf/. Bootstrap existing artifacts before submit when resuming.
deployment_file: deployment.yaml

defaults:
  n_jobs: 64
  workspace_run_id: multi_hp_temp_calib_epsf
  pipeline_plots: true
  crop_mode: target_box
  crop_box_size: 1024

pipeline:
  - kind: shared_mask
  - kind: kernel_fit
    weighting_factor: 0.5
    write_debug_fits: true
    output: kernel_fit
    hp_sigma_gauss: [0.752, 1.88, 3.76]
    hp_ko: 2
    hp_bgo: 3
    hp_nstampx: 10
    hp_nstampy: 10
    hp_nss: 100
    hp_ngauss: 3
    hp_deg_fixe: [6, 4, 2]
    hp_kf_spread_mask1: 0.0
    hp_ks: 3.0
    hp_kfm: 0.75
    hp_fitthresh: 5.0
    hp_stat_sig: 3.0
    hp_force_convolve: "t"
    hp_normalize: "t"
    write_kernel_params: true
  - kind: convolved_templates
    inputs:
      kernel_fit: kernel_fit
    output: tmpl_conv
  - kind: background_estimate
    inputs:
      convolved: tmpl_conv
    output:
      diffs: ks_d
      phot_bkg: ks_b
  # - kind: background_temporal_smoothing
  #   inputs:
  #     bkg_in: ks_b
  #   output: ks_b_s
  #   recombine_inputs: false
  #   steps:
  #     spatial:
  #       enabled: false
  #     temporal:
  #       enabled: false
  #       method: savgol
  #       tile_size: 256
  #     strap:
  #       enabled: false
  - kind: hotpants
    inputs:
      bkg: ks_b
    hp_sigma_gauss: [0.752, 1.88, 3.76]
    hp_ko: 2
    hp_bgo: 0
    hp_nstampx: 10
    hp_nstampy: 10
    hp_nss: 100
    hp_ngauss: 3
    hp_deg_fixe: [6, 4, 2]
    hp_kf_spread_mask1: 0.0
    hp_ks: 3.0
    hp_kfm: 0.75
    hp_fitthresh: 5.0
    hp_stat_sig: 3.0
    hp_force_convolve: "t"
    hp_normalize: "t"
    write_convolved: false
    write_bkg: true
    write_stamps: false
    output:
      diffs: hp_d
      convolved: hp_c
      bkg: hp_b
    write_kernel_solutions: true
  - kind: epsf
    inputs:
      diffs: hp_d
    output: epsf_r1
    tile_nx: 2
    tile_ny: 2
    epsf_oversample: 4
    psf_size: 11
    extract_size: 11
    min_stars_per_tile: 5
    tess_mag_max: 12.95
    epsf_maxiters: 15
    epsf_recentering_maxiters: 20
    epsf_n_jobs: 64
  - kind: centroids
    inputs:
      diffs: hp_d
      epsf: epsf_r1
    output: centroids_r1
    # Crowded galactic-plane crops: mag 12.95 + grouper sep 8 creates groups of
    # hundreds–thousands of stars (s0015 max=274, s0040 max=5707 at sep=8) and
    # centroids never completes a frame. sep=4 keeps max group ~10–25; mag 11
    # caps the catalog near the s0069 regime (~2.6k stars) that finished fine.
    tess_mag_max: 11.0
    fit_shape: 11
    aperture_radius: 2
    psf_grouper_min_separation: 4
    centroids_n_jobs: 32

condor:
  request_cpus: 64
  request_memory: 100000
  host_stats_min_mem_mb: 100000
  host_stats_max_load15: 10.0
