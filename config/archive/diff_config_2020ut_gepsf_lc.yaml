# gepsf-only forced photometry on hp_d frames (delegates to photometry_config).
# SCC-only: workspace_inherit removed; hp_d and epsf_r1 must exist on the SCC diff lane.
deployment_file: deployment.yaml

defaults:
  n_jobs: 16
  workspace_run_id: multi_hp_temp_calib_gepsf_lc
  pipeline_plots: true
  crop_mode: target_box
  crop_box_size: 1024

pipeline:
  - kind: photometry
    config: photometry_config_2020ut_gepsf_lc.yaml

condor:
  request_cpus: 16
  request_memory: 64000
  requirements: "Memory >= 64000 && LoadAvg < 10"
  rank: "-LoadAvg"
