# S0020/C3/K3 distortion-aware field-template lane.  The invocation must use
# exactly `mapping,remap,downsample`; OS4 diff consumption is intentionally
# out of scope.
deployment_file: deployment.yaml

notifications:
  enabled: true
  bot:
    enabled: true
    channel_id: "1513744924133294171"

stages:
  mapping:
    oversampling_factor: 4
    store_name: tvwcs
    wcs_source: temporal_wcs
    temporal_wcs_version: temporal_cheb5_bspline_v1
    skip_download_catalog: false
    n_threads: 64
    condor_request_cpus: 64
  remap:
    store_name: tvwcs
    drift_source: per_skycell_temporal_wcs
    rebuild_remap_cache: true
    rebuild_inter_skycell_cache: true
    n_jobs: 64
    # OS4 remap stages all mapping regmaps to execute-host scratch. The
    # completed S20 lane is ~6.5 GB, so request ample local disk explicitly.
    # (stage_regmaps_to_scratch now defaults to False globally; set true
    # explicitly here since remap's condor_request_disk was sized for it.)
    stage_regmaps_to_scratch: true
    condor_request_disk: 16000
    condor_request_cpus: 64
    condor_request_memory: 250_000
  ps1_process:
    # PS1 processing was completed previously; reruns of this run's
    # downsample stage consume the shared, cross-sector ps1_convolved.zarr /
    # ps1_combined.zarr stores (use_shared_convolved_store must be true here
    # to match how this SCC's ps1_process actually ran -- the dataclass
    # default is false). This is safe as of the recipe-matched
    # fingerprint-resolution fix in
    # combined_store.py/convolved_store.py/field_downsample.py/
    # padding_correction.py -- downsample always resolves the fingerprint
    # matching *this* recipe (remove_saturated_stars=True,
    # bright_star_mag_threshold=13.0, psf_sigma=40.0), never "whichever
    # fingerprint has the newest mtime" from an unrelated sector/run sharing
    # the same sky cell.
    ps1_source: stream
    use_shared_convolved_store: true
    write_per_scc_convolved_zarr: false
  downsample:
    geometry_mode: field
    oversampling_factor: 4
    remap_store_name: tvwcs
    output_store_name: tvwcs
    rebuild_field_store: true
    # Dispatch writes only representative debug FITS under debug_plots/.
    materialize_fits: false
    n_jobs: 64
    executor: condor
    condor_request_cpus: 64
    # Thread oversubscription (64 procs x unbounded BLAS threads) is now
    # fixed generically via condor.py env vars (OMP/OPENBLAS/MKL/NUMEXPR
    # NUM_THREADS=1), so 64 is safe again.
    condor_request_memory: 250000
    # Auto-enabling under Condor tries to copy all 999 os4 regmap FITS to the
    # execute host's local scratch disk, which can be too small (ENOSPC) and
    # then falls back to NFS anyway, just wasting ~1 min of setup. Read
    # regmaps from shared NFS directly, matching the original successful run.
    stage_regmaps_to_scratch: false

resources:
  mapping:
    max_concurrent: 1
  remap:
    max_concurrent: 1
  downsample:
    max_concurrent: 1
