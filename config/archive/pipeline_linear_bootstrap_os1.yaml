# Field point-drift bootstrap (os1): no L4a/L4b correction, drift_source: point.
# Writes the `field_no_correction` store lane with template FITS under fits/.
# Chains to diff via diff_config_scc_linear_centroids_os1.yaml (paths.template_store_name).
#
# Usage:
#   mamba activate syndiff
#   syndiff diff submit \
#     --config config/pipeline_linear_bootstrap_os1.yaml \
#     --scc config/scc_s20_s22_c3_k3.csv \
#     --stages remap,downsample,diff \
#     --run-id s20_s22_linear_centroids_os1 \
#     --force-rerun --skip-artifact-verify
deployment_file: deployment.yaml
diff_config: diff_config_scc_linear_centroids_os1.yaml

stages:
  wcs_grouping:
    geometry_mode: field
    offset_threshold: 0.01
    wcs_drift_savgol_window: 11
    wcs_drift_savgol_polyorder: 2
  mapping:
    oversampling_factor: 1
    template_conv_pad_spare_px: 4
    buffer: 200
    tess_buffer: 150
    skip_download_catalog: false
  remap:
    drift_source: point
    apply_intra_skycell: false
    apply_inter_skycell: false
    store_name: field_no_correction
    intra_skycell_R: 1
    rebuild_remap_cache: true
    rebuild_inter_skycell_cache: false
    raw_drift_outlier_sigma: 5.0
    n_jobs: 32
    executor: condor
    condor_request_cpus: 32
    condor_request_memory: 128000
  downsample:
    geometry_mode: field
    apply_intra_skycell: false
    apply_inter_skycell: false
    remap_store_name: field_no_correction
    output_store_name: field_no_correction
    rebuild_field_store: true
    materialize_fits: false
    oversampling_factor: 1
    ignore_mask_bits: [12]
    n_jobs: 32
    stage_regmaps_to_scratch: false
    executor: condor
    condor_request_cpus: 32
    condor_request_memory: 128000
    condor_request_disk: 4096
  diff:
    executor: condor

resources:
  network:
    max_concurrent: 1
  downsample:
    max_concurrent: 2
  mapping:
    max_concurrent: 2
  remap:
    max_concurrent: 2
  ps1_process:
    max_concurrent: 2
  diff:
    max_concurrent: 2

scheduler:
  skip_artifact_verify: true
  verify_budget_per_tick: 0
  heartbeat_interval_s: 30.0

notifications:
  enabled: true
  events:
    run_started: true
    run_completed: true
    run_failed: true
    stage_failed: true
    stage_completed: true
  bot:
    enabled: true
