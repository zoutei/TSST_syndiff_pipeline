# Resume multi-kernel diff without temporal background smoothing.
# SCC-only: workspace_inherit removed; ks_b must exist on the SCC diff lane.
# Use: point run source_diff_config_path here, then syndiff retry --stage diff
deployment_file: deployment.yaml

defaults:
  n_jobs: 16
  pipeline_plots: false
  crop_mode: target_box
  crop_box_size: 1024
  workspace_run_id: multi_hp_nosmooth

pipeline:
  - external_workspaces:
      - ks_b
  - kind: hotpants
    inputs:
      bkg: ks_b
    hp_sigma_gauss: [0.752, 1.88, 3.76]
    hp_ko: 2
    hp_bgo: 0
    hp_nstampx: 10
    hp_nstampy: 10
    hp_nss: 100
    hp_ngauss: 3
    hp_deg_fixe: [6, 4, 2]
    hp_kf_spread_mask1: 0.0
    hp_ks: 3.0
    hp_kfm: 0.75
    hp_fitthresh: 5.0
    hp_stat_sig: 3.0
    hp_force_convolve: "t"
    hp_normalize: "t"
    write_convolved: false
    write_bkg: true
    write_stamps: false
    output:
      diffs: hp_d
      convolved: hp_c
      bkg: hp_b
    write_kernel_solutions: true

condor:
  request_cpus: 16
  request_memory: 100000
  host_stats_min_mem_mb: 100000
  host_stats_max_load15: 10.0
