# CVZ S50/S51 debug run: stop after shared_mask and kernel_fit.
# Produces kernel-fit diagnostics against the post-seam-fix linear templates.
deployment_file: deployment.yaml

defaults:
  n_jobs: 32
  workspace_run_id: cvz_s50_s51_kernel_fit_debug
  pipeline_plots: true
  oversampling_factor: 1

paths:
  template_store_name: linear
  remap_store_name: linear
  output_store_name: linear

pipeline:
  - kind: shared_mask
  - kind: kernel_fit
    weighting_factor: 0.5
    write_debug_fits: true
    output: kernel_fit
    hp_sigma_gauss: [0.752, 1.88, 3.76]
    hp_ko: 2
    hp_bgo: 3
    hp_nstampx: 10
    hp_nstampy: 10
    hp_nss: 100
    hp_ngauss: 3
    hp_deg_fixe: [6, 4, 2]
    hp_kf_spread_mask1: 0.0
    hp_ks: 3.0
    hp_kfm: 0.75
    hp_fitthresh: 5.0
    hp_stat_sig: 3.0
    hp_force_convolve: "t"
    hp_normalize: "t"
    write_kernel_params: true

condor:
  request_cpus: 32
  request_memory: 120000
  host_stats_min_mem_mb: 51200
  host_stats_max_load15: 10.0
