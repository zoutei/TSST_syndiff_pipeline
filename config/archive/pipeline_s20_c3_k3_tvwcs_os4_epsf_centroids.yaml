# Orchestrator wrapper for `syndiff diff submit` -- references the diff
# sub-pipeline policy in diff_config_s20_c3_k3_tvwcs_os4_epsf_centroids.yaml.
# mapping/remap/ps1_process/downsample are handled separately (Phase-3
# Gaia-catalog-fix rebuild); this only ever runs --stages diff.
#
# Use:
#   syndiff diff submit \
#     --config config/pipeline_s20_c3_k3_tvwcs_os4_epsf_centroids.yaml \
#     --scc config/scc_s20_c3_k3.csv --stages diff \
#     --run-id s20_c3_k3_tvwcs_epsf_centroids_<date> --skip-artifact-verify
deployment_file: deployment.yaml
diff_config: diff_config_s20_c3_k3_tvwcs_os4_epsf_centroids.yaml

stages:
  # Not run by this wrapper (diff-only submission) -- declared so the
  # scheduler's external-stage verify (upstream "downsample" completeness
  # check before launching diff) resolves the right on-disk store. Without
  # this, DownsampleStageParams/MappingStageParams/RemapStageParams
  # defaults (output_store_name: templates/, oversampling_factor: 1) make
  # verify look in the wrong place and the run stalls with "blocked by
  # upstream failure" even though the real templates_tvwcs/ store is
  # complete. Values copied from pipeline_s20_c3_k3_tvwcs_os4.yaml, the
  # orchestrator that actually built this lane (found 2026-08-22).
  mapping:
    oversampling_factor: 4
    store_name: tvwcs
  remap:
    store_name: tvwcs
  downsample:
    geometry_mode: field
    oversampling_factor: 4
    remap_store_name: tvwcs
    output_store_name: tvwcs
  diff:
    executor: condor

resources:
  diff:
    # Global cap shared with other diff runs on this daemon (e.g. the CVZ
    # linear rollout) -- must not be left at 1 or this run will serialize
    # behind whatever else is occupying the global "diff" pool. Sized to
    # real cluster headroom (condor_status showed multiple idle 400-500GB
    # nodes) as of 2026-08-22.
    max_concurrent: 10

scheduler:
  heartbeat_interval_s: 30.0

notifications:
  enabled: true
  events:
    run_started: true
    run_completed: true
    run_failed: true
    stage_failed: true
    stage_completed: true
  bot:
    enabled: true
