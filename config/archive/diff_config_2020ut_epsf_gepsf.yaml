# Full 2020ut gridded ePSF + centroids on hp_d diffs.
# SCC-only: workspace_inherit removed; hp_d/hp_m must exist on the SCC diff lane.
deployment_file: deployment.yaml

defaults:
  n_jobs: 64
  workspace_run_id: multi_hp_temp_calib_epsf_2x2
  pipeline_plots: true
  crop_mode: target_box
  crop_box_size: 1024
  # max_ffis omitted → all manifest frames with valid hp_d FITS

pipeline:
  - external_workspaces:
      - hp_d
      - hp_m
  - kind: epsf
    inputs:
      diffs: hp_d
    output: epsf_r1
    tile_nx: 2
    tile_ny: 2
    epsf_oversample: 4
    psf_size: 11
    extract_size: 11
    min_stars_per_tile: 5
    tess_mag_max: 12.95
    epsf_maxiters: 15
    epsf_recentering_maxiters: 20
    epsf_n_jobs: 64
  - kind: centroids
    inputs:
      diffs: hp_d
      epsf: epsf_r1
    output: centroids_r1
    tess_mag_max: 12.95
    fit_shape: 11
    aperture_radius: 2
    psf_grouper_min_separation: 8
    centroids_n_jobs: 64

condor:
  request_cpus: 64
  request_memory: 100000
  requirements: "Memory >= 100000 && LoadAvg < 10"
  rank: "-LoadAvg"
