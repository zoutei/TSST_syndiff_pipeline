# SCC field_no_correction lane diff: shared_mask -> hotpants -> epsf -> centroids (full chip).
# Templates read from templates_field_no_correction/ at oversampling_factor: 1.
deployment_file: deployment.yaml

defaults:
  n_jobs: 64
  workspace_run_id: s20_s22_linear_centroids_os1
  pipeline_plots: true
  oversampling_factor: 1

paths:
  template_store_name: field_no_correction
  remap_store_name: field_no_correction
  output_store_name: field_no_correction

pipeline:
  - kind: shared_mask
  - kind: hotpants
    science: ffi
    hp_sigma_gauss: [0.752, 1.88, 3.76]
    hp_ko: 2
    hp_bgo: 0
    hp_nstampx: 10
    hp_nstampy: 10
    hp_nss: 100
    hp_ngauss: 3
    hp_deg_fixe: [6, 4, 2]
    hp_kf_spread_mask1: 0.0
    hp_ks: 3.0
    hp_kfm: 0.75
    hp_fitthresh: 5.0
    hp_stat_sig: 3.0
    hp_force_convolve: "t"
    hp_normalize: "t"
    write_convolved: false
    write_bkg: true
    write_stamps: false
    write_kernel_solutions: true
    output:
      diffs: hp_d
      convolved: hp_c
      bkg: hp_b
  - kind: epsf
    inputs:
      diffs: hp_d
    output: epsf_r1
    tile_nx: 5
    tile_ny: 5
    epsf_oversample: 4
    psf_size: 15
    extract_size: 15
    min_stars_per_tile: 5
    tess_mag_max: 12.95
    epsf_maxiters: 15
    epsf_recentering_maxiters: 20
    epsf_n_jobs: 64
  - kind: centroids
    inputs:
      diffs: hp_d
      epsf: epsf_r1
    output: centroids_r1
    tess_mag_max: 10.0
    fit_shape: 11
    aperture_radius: 2
    psf_grouper_min_separation: 4
    centroids_n_jobs: 64

condor:
  request_cpus: 64
  request_memory: 100000
  host_stats_min_mem_mb: 100000
  host_stats_max_load15: 10.0
