# S20/C3/K3 field-mode diff (tvwcs/OS4), full chain through epsf+centroids:
# kernel_fit -> convolved_templates -> background_estimate -> hotpants (hp_d) ->
# epsf (orbit_binned) -> centroids. Reads templates_tvwcs/oversampling_4
# (distortion-aware temporal-WCS field templates, rebuilt under the
# Gaia-catalog-wiring fix -- see run s20_c3_k3_tvwcs_catalog_fix_phase3_*).
#
# shared_mask is intentionally omitted: this run reuses the existing
# diff_linear/{shared_mask.fits.fz,hotpants_substamp_stars.csv}, staged into
# diff_tvwcs/ before running (native science crop shape matches: 2048x2048).
#
# Use:
#   syndiff diff submit --config config/diff_config_s20_c3_k3_tvwcs_os4_epsf_centroids.yaml \
#     --scc config/scc_s20_c3_k3.csv --stages diff \
#     --run-id s20_c3_k3_tvwcs_epsf_centroids_<date> --skip-artifact-verify
deployment_file: deployment.yaml

defaults:
  n_jobs: 64
  workspace_run_id: s20_c3_k3_tvwcs_os4_epsf_centroids_v3
  pipeline_plots: true
  oversampling_factor: 4

paths:
  template_store_name: tvwcs
  output_store_name: tvwcs
  remap_store_name: tvwcs

pipeline:
  - kind: kernel_fit
    weighting_factor: 0.5
    write_debug_fits: true
    output: kernel_fit
    hp_sigma_gauss: [0.752, 1.88, 3.76]
    hp_ko: 2
    hp_bgo: 3
    hp_nstampx: 10
    hp_nstampy: 10
    hp_nss: 100
    hp_ngauss: 3
    hp_deg_fixe: [6, 4, 2]
    hp_kf_spread_mask1: 0.0
    hp_ks: 3.0
    hp_kfm: 0.75
    hp_fitthresh: 5.0
    hp_stat_sig: 3.0
    hp_force_convolve: "t"
    hp_normalize: "t"
    write_kernel_params: true
  - kind: convolved_templates
    inputs:
      kernel_fit: kernel_fit
    output: tmpl_conv
  - kind: background_estimate
    inputs:
      convolved: tmpl_conv
    output:
      diffs: ks_d
      phot_bkg: ks_b
  - kind: hotpants
    inputs:
      bkg: ks_b
    # Real, controlled sweep run directly on a live 500GB/64-core production
    # node (plscience7, 2026-08-22, compute-only benchmark -- no disk I/O,
    # same host/hardware for every point so results are directly
    # comparable): at a fixed 64-thread budget, 8x8=8.74s/frame beat
    # 16x4=9.12s, 32x2=9.65s, and the previous 8x4=32-thread default
    # (10.89s/frame on this same host). Fewer concurrent frame-workers each
    # given the FFT-loop's full thread budget wins over more workers with
    # a lower per-frame cap, opposite of the trend seen on a smaller
    # (125GB) dev host at a 32-thread budget -- the two hosts' optima are
    # not the same shape, so this was re-measured at production scale
    # rather than extrapolated.
    hotpants_n_jobs: 8
    hotpants_os_n_jobs: 8
    # group_id changes almost every frame under drift tracking (9 distinct
    # groups seen in a 10-frame smoke test) so a 2-group LRU buys little
    # reuse; cap at 1 to minimize the resident footprint.
    template_cache_max_groups: 1
    hp_sigma_gauss: [0.752, 1.88, 3.76]
    hp_ko: 2
    hp_bgo: 0
    hp_nstampx: 10
    hp_nstampy: 10
    hp_nss: 100
    hp_ngauss: 3
    hp_deg_fixe: [6, 4, 2]
    hp_kf_spread_mask1: 0.0
    hp_ks: 3.0
    hp_kfm: 0.75
    hp_fitthresh: 5.0
    hp_stat_sig: 3.0
    hp_force_convolve: "t"
    hp_normalize: "t"
    write_convolved: false
    write_bkg: true
    write_stamps: false
    output:
      diffs: hp_d
      convolved: hp_c
      bkg: hp_b
    write_kernel_solutions: true
  - kind: epsf
    inputs:
      diffs: hp_d
    output: epsf_r1
    epsf_mode: orbit_binned
    tile_nx: 4
    tile_ny: 4
    epsf_oversample: 4
    psf_size: 15
    extract_size: 15
    min_stars_per_tile: 5
    # Star-selection matched to dev/forward_epsf_wcs's init_study epsf_pool
    # stage (a separate, non-production GPU fitter's own ePSF-prior
    # builder -- the closest analogue to this stage, not its full joint
    # WCS+ePSF fit's own isolated-target selection): tess_mag window
    # (8,13) per init_study/orbit2/config.yaml (its latest study), no
    # isolation filter (epsf_pool never applies one). Applied here on the
    # whole science array (tile_nx/ny 4x4), not that fitter's own
    # 2x2-over-a-central-crop --region restriction.
    tess_mag_min: 8.0
    tess_mag_max: 13.0
    epsf_isolation_min_sep_px: 6.0
    epsf_isolation_neighbor_mag_max: 13.0
    epsf_maxiters: 15
    epsf_recentering_maxiters: 20
    epsf_n_jobs: 64
  - kind: centroids
    inputs:
      diffs: hp_d
      epsf: epsf_r1
    output: centroids_r1
    tess_mag_max: 10.0
    fit_shape: 11
    aperture_radius: 2
    psf_grouper_min_separation: 4
    centroids_n_jobs: 64

condor:
  request_cpus: 64
  # 500GB: cluster nodes are only 128GB or ~520GB class, nothing in
  # between -- any request above 128GB already restricts matching to the
  # 520GB nodes, so there's no reason to under-ask at 200GB. The full
  # 1183-frame run held at ~91-100GB even with template_cache_max_groups
  # bounded (2, now 1); residual footprint at full-SCC scale isn't fully
  # attributed yet (not a runaway leak: usage plateaued, didn't keep
  # climbing), so this is real headroom, not a precisely-sized request
  # (2026-08-22).
  request_memory: 500000
  host_stats_min_mem_mb: 500000
  host_stats_max_load15: 10.0
