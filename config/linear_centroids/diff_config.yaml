# SCC linear-lane diff through centroids (phase 1b).
# kernel_fit -> convolved_templates -> kernel_subtract -> hotpants -> epsf -> centroids
#
# Requires templates_linear/ on the SCC (see pipeline_templates.yaml).
# ePSF and centroids use stage defaults unless overridden.
deployment_file: ../deployment.yaml

defaults:
  n_jobs: 64
  workspace_run_id: scc_linear_kernel_centroids_os1
  pipeline_plots: true
  oversampling_factor: 1

paths:
  template_store_name: linear
  remap_store_name: linear
  output_store_name: linear

pipeline:
  - kind: shared_mask
  - kind: kernel_fit
    weighting_factor: 0.5
    write_debug_fits: true
    output: kernel_fit
    hp_sigma_gauss: [0.752, 1.88, 3.76]
    hp_ko: 2
    hp_bgo: 3
    hp_nstampx: 10
    hp_nstampy: 10
    hp_nss: 100
    hp_ngauss: 3
    hp_deg_fixe: [6, 4, 2]
    hp_kf_spread_mask1: 0.0
    hp_ks: 3.0
    hp_kfm: 0.75
    hp_fitthresh: 5.0
    hp_stat_sig: 3.0
    hp_force_convolve: "t"
    hp_normalize: "t"
    write_kernel_params: true
  - kind: convolved_templates
    inputs:
      kernel_fit: kernel_fit
    output: tmpl_conv
  - kind: kernel_subtract
    inputs:
      convolved: tmpl_conv
    output:
      diffs: ks_d
      phot_bkg: ks_b
  - kind: hotpants
    inputs:
      bkg: ks_b
    hp_sigma_gauss: [0.752, 1.88, 3.76]
    hp_ko: 2
    hp_bgo: 0
    hp_nstampx: 10
    hp_nstampy: 10
    hp_nss: 100
    hp_ngauss: 3
    hp_deg_fixe: [6, 4, 2]
    hp_kf_spread_mask1: 0.0
    hp_ks: 3.0
    hp_kfm: 0.75
    hp_fitthresh: 5.0
    hp_stat_sig: 3.0
    hp_force_convolve: "t"
    hp_normalize: "t"
    write_convolved: false
    write_bkg: true
    write_stamps: false
    output:
      diffs: hp_d
      convolved: hp_c
      bkg: hp_b
    write_kernel_solutions: true
  - kind: epsf
    inputs:
      diffs: hp_d
    output: epsf_r1
  - kind: centroids
    inputs:
      diffs: hp_d
      epsf: epsf_r1
    output: centroids_r1
  - kind: per_ffi_wcs
    inputs:
      centroids: centroids_r1
      diffs: hp_d
    output: wcs
    sip_degree: 5

condor:
  request_cpus: 64
  request_memory: 100000
  host_stats_min_mem_mb: 100000
  host_stats_max_load15: 10.0
