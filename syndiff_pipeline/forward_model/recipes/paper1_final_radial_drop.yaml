# paper1_final_radial with the A3 round blur, dilation and kurtosis fields REMOVED from the render (their coefficients stay inert).
# New named chroma_g8 extras appended AFTER the A3 default extras (so an A3 checkpoint warm-starts with zeros):
#   rb{j}_0, rb{j}_r  colour-linear radial-profile amplitude (a0 + a1 r), ADDITIVE warped cubic B-spline bump B_j(rho), j=1..5
#   rq{j}             quadratic-in-colour amplitude of the same profile
#   rc{j}             radial coma, multiplicative, j=1..3 (own knots)
# Run: python -m syndiff_pipeline.forward_model.recipe paper1_final_radial -- --scene-dir ... --out-dir ...
role: "PRIMARY arm: A3 round blur/dil/kurt dropped, the rb/rc family replaces them"
scene_fit:
  chroma-model: global8
  colour-gauge: global
  chroma-axis: tesspoint
  chroma-radial-mode: add
  chroma-g8-drop: blur,dil,kurt
  chroma-g8-extras: dil_r,sq0,sq1,q1_0,q1_x,q1_y,q2_0,q2_x,q2_y,rb1_0,rb1_r,rb2_0,rb2_r,rb3_0,rb3_r,rb4_0,rb4_r,rb5_0,rb5_r,rq1,rq2,rq3,rq4,rq5,rc1,rc2,rc3
  huber-delta: 1.0e6
  reject-every: 0
  lambda-lap: 1.0e-2
  lambda-pixel-lap: 1.0e-2
  lambda-fine-nbr: 0
  lambda-local-poly: 3.0e8
  local-poly-window: 7
  lr-per-stage: 1e-3,3e-4,1e-4
  epsf-lr-scale: 2.5
  chroma-lr-scale: 10
  stop-rule: smoothed
  steps-per-stage: 3000,20000,20000
  star-weight-cap-tmag: 10.5
  anchors-train-epsf: true
  checkpoint-every: 100
