# STEP 1 inner-RADIAL variant (kept for reference; step A found no m=0 core gain, superseded by paper1_final_step1). (2026-10-09, branch colour-rf5-20261009; requested by the ePSF model orchestrator, user-approved):
# one degeneracy-clean colour basis, trained FRESH from the per-fold init exactly like paper1_final (same schedule).
#  - FULL colour law of paper1_final_radial_full_drop: radial ADDITIVE rb{j}_0/_r/_r2 + rq{j}, coma rc{j}/_r/_r2 + rcq{j};
#  - A3 round colour fields blur, dilation, kurtosis DROPPED (degenerate with the radial rings, |cos| 0.85-0.97);
#  - shift FREE (s0..s2, sq0, sq1 train); trefoil and the elongation planes q1_*, q2_* kept;
#  - radial knots with an INNER knot (0.35 px) for the red core: 6 bumps rb1..rb6;
#  - outer taper: radial bumps fade to 0 between the last knot (5.5 px) and 7 px ('add@7.0'), no stamp-wide pedestal;
#  - CCD colour translation held at zero natively (frozen0), as paper1_final on the rf5 pin.
# Controls: '--chroma-radial-mode add' (no taper); paper1_final_radial_full_drop + frozen0 (5 knots, no taper).
role: "STEP1 variant NOT trained (step A: no m=0 core gain): full law, A3 round colour terms dropped, shift free, inner knot 0.35 px, radial taper to 0 at 7 px"
scene_fit:
  chroma-model: global8
  colour-gauge: global
  chroma-axis: tesspoint
  chroma-ccd-shift: frozen0
  chroma-radial-mode: add@7.0
  chroma-radial-knots: 0,0.35,0.7,1.5,3.0,5.5
  chroma-g8-drop: blur,dil,kurt
  chroma-g8-extras: dil_r,sq0,sq1,q1_0,q1_x,q1_y,q2_0,q2_x,q2_y,rb1_0,rb1_r,rb2_0,rb2_r,rb3_0,rb3_r,rb4_0,rb4_r,rb5_0,rb5_r,rb6_0,rb6_r,rq1,rq2,rq3,rq4,rq5,rq6,rc1,rc2,rc3,rb1_r2,rb2_r2,rb3_r2,rb4_r2,rb5_r2,rb6_r2,rc1_r,rc2_r,rc3_r,rc1_r2,rc2_r2,rc3_r2,rcq1,rcq2,rcq3
  huber-delta: 1.0e6
  reject-every: 0
  lambda-lap: 1.0e-2
  lambda-pixel-lap: 1.0e-2
  lambda-fine-nbr: 0
  lambda-local-poly: 3.0e8
  local-poly-window: 7
  lr-per-stage: 1e-3,3e-4,1e-4
  epsf-lr-scale: 2.5
  chroma-lr-scale: 10
  stop-rule: smoothed
  steps-per-stage: 3000,20000,20000
  star-weight-cap-tmag: 10.5
  anchors-train-epsf: true
  checkpoint-every: 100
